[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pathology-delta-evaluation"
version = "1.0.0"
description = "Evaluation, statistical analysis and numerical reporting for DELTA"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [{name = "Yoonho Choi"}]
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "pyarrow>=14",
  "scikit-learn>=1.3,<2",
  "scipy>=1.10,<2",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
reporting = ["openpyxl>=3.1,<4"]
models = ["torch>=2.1,<3"]
benchmark = ["torch>=2.1,<3", "inmoose==0.7.8"]
molecular = ["anndata>=0.10,<1", "h5py>=3.10,<4", "zarr>=2.18.7,<3", "torch>=2.1,<3", "torchmetrics>=1.3,<2"]
test = ["pytest>=8,<9"]

[project.scripts]
delta-evaluation-splits = "experiments.common.split_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["experiments", "experiments.*"]

[tool.setuptools.package-data]
"experiments.plism_analysis" = ["release_manifest.json"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "integration: requires external data or an optional research runtime",
  "models: requires the optional PyTorch CPU runtime for downstream learners",
]
