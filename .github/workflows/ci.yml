name: Evaluation CI

on:
  push:
  pull_request:

jobs:
  evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test,reporting]"
      - run: python -m pytest -m "not models"
      - name: Verify evaluation wheel contains no DELTA core
        shell: bash
        run: |
          python -m pip wheel --no-deps . --wheel-dir "$RUNNER_TEMP/evaluation-wheel"
          python -m pip install --no-deps --force-reinstall "$RUNNER_TEMP/evaluation-wheel/"*.whl
          cd "$RUNNER_TEMP"
          python -c "import importlib.util; import experiments.pathorob.summary, experiments.patch_aggregation.statistics, experiments.wsi_survival.summary; from experiments.plism_analysis.provenance import verify_release_manifest; assert importlib.util.find_spec('delta') is None; assert len(verify_release_manifest()['files']) == 47; print('evaluation package only: OK')"
  models:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "torch>=2.1,<3" --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[test,reporting,models]"
      - run: python -m pytest
